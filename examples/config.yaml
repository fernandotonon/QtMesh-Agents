orchestrator:
  # heuristic = local deterministic planner (default)
  # claude|codex|cursor = ask that provider for a JSON plan (falls back to heuristic)
  provider: heuristic
  maxPlanningIterations: 5
  requireApprovalForMerge: true

agents:
  claude:
    enabled: true
    command: claude
  codex:
    enabled: true
    command: codex
    # Use danger-full-access on GPU workstations (qtmesh/TRELLIS need Metal/OpenGL).
    # workspace-write seatbelt blocks graphics and surfaces false "needs graphics" stalls.
    sandbox: danger-full-access
    approveForMe: true
  cursor:
    enabled: true
    command: cursor-agent
  mock:
    enabled: true
    command: qma-mock-agent

execution:
  maxConcurrentAgents: 3
  timeoutMinutes: 30
  maxRetries: 2
  useGitWorktrees: true

routing:
  strategy: balanced
  preferences:
    architecture: claude
    implementation: cursor
    frontend: codex
    testing: codex
    review: claude
  fallback:
    - codex
    - claude
    - cursor
  # Bench leader / AskLeader chain. On quota/token exhaustion the next
  # available entry is reseated (claude → cursor → codex).
  leadershipFallback:
    - claude
    - cursor
    - codex
  maxConcurrentAgents: 3

storage:
  driver: sqlite

ui:
  theme: dark
  showUsage: true

daemon:
  # Web workspace (browser SPA + REST/WS). Closing the tab never kills agents.
  httpEnabled: true
  # Bind: localhost, Tailscale IP (100.x), or 0.0.0.0 for LAN/Tailscale.
  httpListen: "0.0.0.0:7432"
  # Empty => daemon auto-generates on first start and writes it back here.
  # Show with: qma web token   | open UI: qma web
  httpAuthToken: ""
