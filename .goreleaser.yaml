version: 2

project_name: qtmesh-agents

builds:
  - id: qma
    main: ./cmd/qma
    binary: qma
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X github.com/fernandotonon/QtMesh-Agents/pkg/version.Version={{.Version}}
      - -X github.com/fernandotonon/QtMesh-Agents/pkg/version.Commit={{.ShortCommit}}
      - -X github.com/fernandotonon/QtMesh-Agents/pkg/version.Date={{.Date}}

archives:
  - name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]

release:
  draft: true
  name_template: "QtMesh Agents {{ .Tag }}"
  header: |
    Install with scripts/install.sh, then run `qma init` to set up agents.

checksum:
  algorithm: sha256
  name_template: checksums.txt

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
